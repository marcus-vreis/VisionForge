# sonar.projectKey and sonar.organization are configured for this repository.
# If you create your own project on https://sonarcloud.io, update these values accordingly.

sonar.projectKey=marcus-vreis_VisionForge
sonar.organization=marcus-vreis

sonar.projectName=VisionForge
# CI derives sonar.projectVersion from this checkout's pyproject.toml (ADR-147).

# Source and test directories
sonar.sources=src/
sonar.tests=tests/
sonar.inclusions=src/**/*.py

# Python coverage report (generated by pytest-cov --cov-report=xml)
sonar.python.coverage.reportPaths=coverage.xml
# Same omission as .coveragerc: package __init__ files are re-exports, and
# pytest-cov never reports them, so Sonar would count them as uncovered.
sonar.coverage.exclusions=src/visionforge/*/__init__.py

# Encoding
sonar.sourceEncoding=UTF-8
