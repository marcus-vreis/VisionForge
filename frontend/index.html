<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VisionForge: train and compare computer vision models on your own computer." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07080a" />
    <!-- Paints the chosen theme before the bundle loads (ADR-125); lib/theme.ts takes over. -->
    <script>
      try {
        var vfTheme = localStorage.getItem("vf.theme");
        if (vfTheme !== "light" && vfTheme !== "dark") {
          vfTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = vfTheme;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <title>VisionForge — Local AI Training</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
