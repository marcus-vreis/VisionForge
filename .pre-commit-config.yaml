repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
        args: [--write-changes]
        # Skip lockfiles + built/minified assets where typo-fixing is unsafe.
        exclude: "(package-lock\\.json|src/visionforge/gui/static/.*|frontend/dist/.*)"

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.0
    hooks:
      - id: mypy
        additional_dependencies: [loguru, pydantic>=2.0, types-PyYAML>=6.0]
        args: [--ignore-missing-imports]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        # --frozen: run against the lockfile as it is, never rewrite it. Without
        # it, `uv run` re-locks whenever pyproject.toml changed — which is
        # exactly what a release commit does — pre-commit then sees a modified
        # uv.lock, reports "files were modified by this hook" and aborts. That
        # made `bump-my-version bump` (ADR-073) fail every single time.
        entry: uv run --frozen pytest
        language: system
        pass_filenames: false
        always_run: true