repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
        args: [--write-changes]
        # Skip lockfiles + built/minified assets where typo-fixing is unsafe.
        exclude: "(package-lock\\.json|src/visionforge/gui/static/.*|frontend/dist/.*)"

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.0
    hooks:
      - id: mypy
        additional_dependencies: [loguru, pydantic>=2.0, types-PyYAML>=6.0]
        args: [--ignore-missing-imports]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        # A test hook verifies the tree; it does not curate the environment.
        # --frozen: never rewrite uv.lock. `uv run` re-locks whenever
        #   pyproject.toml changed — exactly what a release commit does — and
        #   pre-commit then aborts on the modified lockfile, which made
        #   `bump-my-version bump` (ADR-073) fail every single time.
        # --no-sync: never reinstall the project either. The reinstall replaces
        #   Scripts/visionforge.exe, which Windows refuses to delete while a
        #   `visionforge gui` server is running — committing with the GUI open
        #   failed with "o arquivo já está sendo usado por outro processo".
        entry: uv run --frozen --no-sync pytest
        language: system
        pass_filenames: false
        always_run: true