[project]
name = "visionforge-studio"
authors = [{ name = "Marcus Reis", email = "marcusvinicius0083@gmail.com" }]
version = "0.3.1"
dynamic = []
description = "Local-first computer-vision experimentation platform: five task families, multi-seed replicates with confidence intervals, K-fold CV, sweeps and full run provenance — on your own GPU."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [

  # NOTE: torch + torchvision are intentionally NOT here (ADR-005). They have
  # hardware-specific builds (CPU / cu118 / cu121 / cu124 / cu126 / cu128) that a
  # resolver cannot pick correctly, so the user chooses one via a hardware
  # extra — e.g. `pip install -e ".[cu121]"` (GPU) or `".[cpu]"` (CPU-only).

  # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "pyyaml>=6.0",
    "rich>=13.0",

  # GUI (React SPA served by FastAPI)
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
visionforge = "visionforge.__main__:main"

[project.urls]
Repository = "https://github.com/marcus-vreis/VisionForge"
Documentation = "https://github.com/marcus-vreis/VisionForge/tree/main/documentation"

[project.optional-dependencies]
# Hardware extras (ADR-005): pick exactly ONE to install torch + torchvision
# from the matching index configured under [tool.uv.sources] below.
#   pip install -e ".[cu121]"   # NVIDIA CUDA 12.1   (or cu118 / cu124 / cu126 / cu128)
#   RTX 50-series (Blackwell, sm_120) needs cu128 — earlier wheels carry no
#   kernel for it, so they see the GPU and then fail to run on it.
#   pip install -e ".[cpu]"     # CPU-only
cpu = ["torch>=2.3", "torchvision>=0.18"]
cu118 = ["torch>=2.3", "torchvision>=0.18"]
cu121 = ["torch>=2.3", "torchvision>=0.18"]
cu124 = ["torch>=2.3", "torchvision>=0.18"]
cu126 = ["torch>=2.3", "torchvision>=0.18"]
cu128 = ["torch>=2.3", "torchvision>=0.18"]
# Object detection (Phase 7). Ultralytics drives YOLO/RT-DETR training; it pulls
# torch/torchvision, which still come from the hardware extra the user selected.
detection = [
    "ultralytics>=8.3",
]
# Extra model backbones (ADR-051): timm exposes hundreds of pretrained
# architectures usable as classification/regression heads via the `timm_model`
# config field. Pulls torch/torchvision from the hardware extra the user selected.
timm = [
    "timm>=1.0",
]
# Optuna-guided hyperparameter sweep (ADR-052): the `optuna` sweep mode uses a TPE
# sampler over the random search-space grammar. Optional; imported lazily.
optuna = [
    "optuna>=3.0",
]
# TensorBoard experiment tracking (ADR-054): when installed, trainers write
# per-epoch scalars to <run_dir>/tensorboard/. Optional; logging is a best-effort
# no-op without it.
tensorboard = [
    "tensorboard>=2.0",
]
# Online dataset download providers (ADR-055): each is an optional, lazily-imported
# source for the one-shot GUI dataset fetch. torchvision built-ins need no extra.
roboflow = [
    "roboflow>=1.1",
]
kaggle = [
    "kaggle>=1.6",
]
huggingface = [
    "datasets>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "codespell>=2.3",
    "pre-commit>=4.0",
    "bump-my-version>=0.24",
    "types-PyYAML>=6.0",
]

# Scripts will be added once the referenced modules exist:
#   visionforge     = "visionforge.__main__:main"
#   visionforge-gui = "visionforge.gui.app:launch"

[build-system]
requires      = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The pre-built React SPA must ship inside the wheel — `visionforge gui`
# serves it from the installed package (end users never run Node).
[tool.setuptools.package-data]
visionforge = ["gui/static/**"]

[tool.ruff]
line-length    = 88
target-version = "py313"
exclude        = [".venv", "build", "dist", "__pycache__", "outputs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E203", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["visionforge"]

[tool.ruff.format]
quote-style              = "double"
indent-style             = "space"
skip-magic-trailing-comma = false

[tool.codespell]
skip = ".venv,*.lock,outputs,htmlcov,*.egg-info,package-lock.json,src/visionforge/gui/static,frontend/node_modules"
ignore-words = ".codespell-ignore-words.txt"

[tool.bumpversion]
current_version = "0.3.1"
parse           = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize       = ["{major}.{minor}.{patch}"]
commit          = true
tag             = true
tag_name        = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search   = 'version = "{current_version}"'
replace  = 'version = "{new_version}"'

# CITATION.cff is a data file, so it cannot read the installed metadata the way
# the package does — it has to be rewritten by the bump or it silently ships a
# stale version to anyone who cites the project.
[[tool.bumpversion.files]]
filename = "CITATION.cff"
search   = 'version: {current_version}'
replace  = 'version: {new_version}'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search   = "## [Unreleased]"
replace  = "## [Unreleased]\n\n## [{new_version}] — {now:%Y-%m-%d}"

[tool.mypy]
python_version         = "3.13"
warn_return_any        = true
ignore_missing_imports = true
exclude                = ["outputs/", "configs/", ".venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Slow cases train real models through a live server (ADR-060). They are
# deselected here so the pre-commit suite stays seconds-fast; run them with
# `pytest -m slow`, or the full matrix with `visionforge selftest`.
addopts   = "-v --cov=src --cov-report=term-missing -m 'not slow'"
markers = [
    "slow: end-to-end cases that start a server and train real models",
]


[tool.coverage.run]
source = ["src/visionforge"]
relative_files = true
omit = [
    "src/visionforge/__init__.py",
    "src/visionforge/*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "extra == 'cu118'" },
  { index = "pytorch-cu121", marker = "extra != 'cu118' and extra == 'cu121'" },
  { index = "pytorch-cu124", marker = "extra != 'cu118' and extra != 'cu121' and extra == 'cu124'" },
  { index = "pytorch-cu126", marker = "extra != 'cu118' and extra != 'cu121' and extra != 'cu124' and extra == 'cu126'" },
  { index = "pytorch-cu128", marker = "extra != 'cu118' and extra != 'cu121' and extra != 'cu124' and extra != 'cu126' and extra == 'cu128'" },
  { index = "pytorch-cpu", marker = "extra != 'cu118' and extra != 'cu121' and extra != 'cu124' and extra != 'cu126' and extra != 'cu128' and extra == 'cpu'" },
  # Default when no hardware extra is selected: CPU (wheels exist for every
  # supported Python incl. 3.13). GPU users opt in explicitly via .[cu121] etc.
  { index = "pytorch-cpu", marker = "extra != 'cu118' and extra != 'cu121' and extra != 'cu124' and extra != 'cu126' and extra != 'cu128' and extra != 'cpu'" },
]
torchvision = [
  { index = "pytorch-cu118", marker = "extra == 'cu118'" },
  { index = "pytorch-cu121", marker = "extra != 'cu118' and extra == 'cu121'" },
  { index = "pytorch-cu124", marker = "extra != 'cu118' and extra != 'cu121' and extra == 'cu124'" },
  { index = "pytorch-cu126", marker = "extra != 'cu118' and extra != 'cu121' and extra != 'cu124' and extra == 'cu126'" },
  { index = "pytorch-cu128", marker = "extra != 'cu118' and extra != 'cu121' and extra != 'cu124' and extra != 'cu126' and extra == 'cu128'" },
  { index = "pytorch-cpu", marker = "extra != 'cu118' and extra != 'cu121' and extra != 'cu124' and extra != 'cu126' and extra != 'cu128' and extra == 'cpu'" },
  # Default when no hardware extra is selected: CPU (see torch block above).
  { index = "pytorch-cpu", marker = "extra != 'cu118' and extra != 'cu121' and extra != 'cu124' and extra != 'cu126' and extra != 'cu128' and extra != 'cpu'" },
]