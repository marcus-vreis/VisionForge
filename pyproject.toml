[project]
name = "visionforge-studio"
authors = [{ name = "Marcus Reis", email = "marcusvinicius0083@gmail.com" }]
version = "0.22.3"
dynamic = []
description = "Local-first computer-vision experimentation platform: five task families, multi-seed replicates with confidence intervals, K-fold CV, sweeps and full run provenance — on your own GPU."
readme = "README.md"
license = "MIT"
# PEP 639: both files land in the wheel's .dist-info/licenses/. The notices list
# the copyleft dependencies and the OFL fonts the GUI bundles (#176).
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
keywords = [
    "computer-vision", "deep-learning", "pytorch", "experiment-tracking",
    "reproducibility", "statistical-testing", "confidence-intervals",
    "image-classification", "object-detection", "semantic-segmentation",
    "anomaly-detection", "gui",
]
# PyPI's search filters and the sidebar of the project page read these; with
# none, the package does not show up under any topic or Python version.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [

  # NOTE: torch + torchvision are intentionally NOT here (ADR-005). They have
  # hardware-specific builds (CPU / cu126 / cu128 / cu130) that a resolver
  # cannot pick correctly, so the user chooses one via a hardware extra —
  # e.g. `pip install -e ".[cu128]"` (GPU) or `".[cpu]"` (CPU-only).

  # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "onnx>=1.21",            # floors past known advisories (SEC-4, #160)
    "pillow>=12.2",          # imported directly; decodes third-party images
    "onnxruntime>=1.18",
    "pyyaml>=6.0",
    "rich>=13.0",

  # GUI (React SPA served by FastAPI)
    "fastapi>=0.115",
    "uvicorn>=0.30",

  # Everything the five tasks and the dataset providers need (ADR-106). These
  # were optional extras, and the split cost more than it saved: the detection
  # tab shipped without a backend until you found the right install line. They
  # add ~83 MB, against the 2-3 GB a CUDA torch already pulls.
  # ultralytics is AGPL-3.0 (THIRD_PARTY_NOTICES.md); ADR-195 made it the
  # `detection` extra and ADR-243 brought it back here.
    "ultralytics>=8.3",      # YOLO / RT-DETR backends
    "timm>=1.0",             # extra backbones via model.timm_model
    "optuna>=3.0",           # TPE-guided sweeps
    "tensorboard>=2.0",      # per-epoch scalars under <run_dir>/tensorboard/
    "roboflow>=1.1",         # dataset download provider
    "kaggle>=1.6",           # dataset download provider
    "datasets>=2.0",         # Hugging Face dataset download provider
]

[project.scripts]
visionforge = "visionforge.__main__:main"

[project.urls]
Repository = "https://github.com/marcus-vreis/VisionForge"
# `documentation/` was renamed to `docs/`; the old link was a 404 on PyPI.
Documentation = "https://github.com/marcus-vreis/VisionForge/tree/main/docs"
Changelog = "https://github.com/marcus-vreis/VisionForge/blob/main/CHANGELOG.md"
Issues = "https://github.com/marcus-vreis/VisionForge/issues"

[project.optional-dependencies]
# Hardware extras (ADR-005): pick exactly ONE to install torch + torchvision
# from the matching index configured under [tool.uv.sources] below.
#   pip install -e ".[cu130]"   # NVIDIA CUDA 13.0   (or cu126 / cu128)
#   RTX 50-series (Blackwell, sm_120) needs cu128 or cu130 — earlier wheels
#   carry no kernel for it, so they see the GPU and then fail to run on it.
#   pip install -e ".[cpu]"     # CPU-only
# Floors (ADR-198): torch 2.13 leaves every published torch advisory behind;
# the cu128 index stops at 2.11, so cu128 gets the 2.10 floor (only a low
# torch.jit.script advisory remains there). cu118/cu121/cu124 were removed
# (ADR-209): their indexes stopped at 2.7.1/2.5.1/2.6.0, with a critical
# torch.load RCE among the advisories, and any CUDA 12 driver runs cu126.
cpu = ["torch>=2.13", "torchvision>=0.28"]
cu126 = ["torch>=2.13", "torchvision>=0.28"]
cu128 = ["torch>=2.10", "torchvision>=0.25"]
cu130 = ["torch>=2.13", "torchvision>=0.28"]
# mlflow, wandb, comet, dvc and hub are optional exporters (ADR-170, ADR-171,
# ADR-172, ADR-200, ADR-176): they install something. detection, timm, optuna,
# tensorboard, roboflow, kaggle and huggingface are empty: everything they used
# to install ships with the package (ADR-106, ADR-243). Those names
# stay so an install line saved in a requirements file or a README elsewhere
# keeps resolving instead of failing.
mlflow = ["mlflow==3.18.0"]
wandb = ["wandb==0.31.0"]
comet = ["comet-ml==3.58.12"]
dvc = ["dvc==3.67.1"]
detection = []
timm = []
optuna = []
tensorboard = []
roboflow = []
kaggle = []
huggingface = []
hub = ["huggingface-hub>=1.16.1,<3"]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    # Exact pin: CI installs the newest release and mypy 2.x flagged code the
    # local hook (1.x) accepted. Keep this, .pre-commit-config.yaml `rev` and
    # uv.lock on the same version so the hook, CI and `uv run mypy` agree.
    "mypy==2.4.1",
    "codespell>=2.3",
    "pre-commit>=4.0",
    "bump-my-version>=0.24",
    "types-PyYAML>=6.0",
]

# Scripts will be added once the referenced modules exist:
#   visionforge     = "visionforge.__main__:main"
#   visionforge-gui = "visionforge.gui.app:launch"

[build-system]
requires      = ["setuptools>=77"]  # 77: SPDX `license` + `license-files`
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The pre-built React SPA must ship inside the wheel — `visionforge gui`
# serves it from the installed package (end users never run Node).
[tool.setuptools.package-data]
visionforge = ["gui/static/**"]

[tool.ruff]
line-length    = 88
target-version = "py312"
exclude        = [".venv", "build", "dist", "__pycache__", "outputs", "research/workflow_benchmark/results"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E203", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["visionforge"]

[tool.ruff.format]
quote-style              = "double"
indent-style             = "space"
skip-magic-trailing-comma = false

[tool.codespell]
skip = ".venv,*.lock,outputs,htmlcov,*.egg-info,package-lock.json,src/visionforge/gui/static,frontend/node_modules"
ignore-words = ".codespell-ignore-words.txt"

[tool.bumpversion]
current_version = "0.22.3"
parse           = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize       = ["{major}.{minor}.{patch}"]
commit          = true
tag             = true
tag_name        = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search   = 'version = "{current_version}"'
replace  = 'version = "{new_version}"'

# CITATION.cff is a data file, so it cannot read the installed metadata the way
# the package does — it has to be rewritten by the bump or it silently ships a
# stale version to anyone who cites the project.
[[tool.bumpversion.files]]
filename = "CITATION.cff"
search   = 'version: {current_version}'
replace  = 'version: {new_version}'

# The release date sits next to the version and was never rewritten, so
# CITATION.cff went out saying 0.10.0 was released on 2026-07-02 — the date of a
# much older cut. Anyone citing the software got the wrong date.
[[tool.bumpversion.files]]
filename = "CITATION.cff"
regex    = true
search   = 'date-released: \d{{4}}-\d{{2}}-\d{{2}}'
replace  = 'date-released: {now:%Y-%m-%d}'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search   = "## [Unreleased]"
replace  = "## [Unreleased]\n\n## [{new_version}] — {now:%Y-%m-%d}"

[tool.mypy]
python_version         = "3.12"
warn_return_any        = true
ignore_missing_imports = true
exclude                = ["outputs/", "configs/", ".venv/"]

[tool.pytest.ini_options]
testpaths = ["tests", "research"]
pythonpath = ["src"]
# Slow cases train real models through a live server (ADR-060). They are
# deselected here so the pre-commit suite stays seconds-fast; run them with
# `pytest -m slow`, or the full matrix with `visionforge selftest`.
addopts   = "-v --cov=src --cov-report=term-missing -m 'not slow'"
markers = [
    "slow: end-to-end cases that start a server and train real models",
]
# Later entries win. Deprecations raised from our own code (src, tests, research)
# and schema warnings on our models fail the suite (AUDIT achado 18); the ignores
# below are third-party warnings we cannot fix, each matched by message and module.
filterwarnings = [
    "error::DeprecationWarning:visionforge",
    "error::PendingDeprecationWarning:visionforge",
    "error::FutureWarning:visionforge",
    "error::DeprecationWarning:tests",
    "error::DeprecationWarning:research",
    "error::pydantic.json_schema.PydanticJsonSchemaWarning",
    # onnx_export.py keeps the TorchScript exporter on purpose (dynamo=False).
    "ignore:You are using the legacy TorchScript-based ONNX export:DeprecationWarning:visionforge.core.onnx_export",
    "ignore:The feature will be removed. Please remove usage of this function:DeprecationWarning:torch.onnx",
]


[tool.coverage.run]
source = ["src/visionforge"]
relative_files = true
omit = [
    "src/visionforge/__init__.py",
    "src/visionforge/*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

# The hardware extras pick different builds of the same torch, so the lock
# resolves one fork per extra instead of a single torch for all (ADR-198).
[tool.uv]
# Old torch forks pull an older setuptools; keep it out of the advisories.
constraint-dependencies = ["setuptools>=84.1"]
conflicts = [
  [
    { extra = "cu126" },
    { extra = "cu128" },
    { extra = "cu130" },
    { extra = "cpu" },
  ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# One build per hardware extra; CUDA indexes carry no macOS wheels, so a Mac
# with a CUDA extra falls back to PyPI. With no extra, torch comes from PyPI.
torch = [
  { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cpu", extra = "cpu" },
]
torchvision = [
  { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cpu", extra = "cpu" },
]
