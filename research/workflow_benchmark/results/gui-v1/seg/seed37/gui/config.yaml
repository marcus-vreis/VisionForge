schema_version: 1
name: real_seg_s37
task: segmentation
model:
  name: deeplabv3_resnet50
  num_classes: 2
  pretrained: true
training:
  learning_rate: 0.0003
  epochs: 40
  batch_size: 16
  early_stopping_patience: 0
  optimizer: adamw
  weight_decay: 0.01
  loss: cross_entropy
  seed: 37
  deterministic: true
  scheduler:
    kind: cosine
data:
  base_dir: ~/vfsmoke/datasets/pet-seg
  images_subdir: images
  masks_subdir: masks
  train_dir: train
  val_dir: val
  test_dir: test
  image_size: 256
  ignore_index: 255
  num_workers: 4
  pin_memory: true
  transforms:
    augment: true
    horizontal_flip: true
    rotation_degrees: 0
    color_jitter: false
output:
  models_dir: ~\vfsmoke\real-v1\gui-v1\seg\seed37\gui\models
  graphics_dir: ~\vfsmoke\real-v1\gui-v1\seg\seed37\gui\graphics
  logs_dir: ~\vfsmoke\real-v1\gui-v1\seg\seed37\gui\logs
  reports_dir: ~\vfsmoke\real-v1\gui-v1\seg\seed37\gui\reports
device:
  kind: cuda
