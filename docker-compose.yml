# VisionForge via Docker Compose — the common case in one command.
#
#   docker compose up                 # GPU
#   docker compose --profile cpu up   # no GPU on this machine
#
# Datasets are mounted read-only and outputs read-write, so the container never
# writes anything that matters to its own filesystem and nothing user-specific
# is baked into the image.

services:
  visionforge:
    build:
      context: .
      args:
        # Change both together — the wheel tag and the CUDA runtime it needs.
        # cu128 spans sm_75 (Turing) to sm_120 (Blackwell); cu124 has no sm_120
        # kernel, so an RTX 50-series card sees the GPU and then cannot use it.
        CUDA_TAG: cu128
        BASE_IMAGE: nvidia/cuda:12.8.1-runtime-ubuntu22.04
    image: visionforge:cu128
    ports:
      - "8000:8000"
    volumes:
      # Read-only: training reads images, it has no business modifying them.
      - ./datasets:/work/datasets:ro
      # Read-write: runs, checkpoints, reports and run.json land here and
      # survive the container.
      - ./outputs:/work/outputs
      # Your own architectures and task families, picked up from the working
      # directory exactly as they are outside Docker.
      - ./user_models:/work/user_models
      - ./user_tasks:/work/user_tasks
      # Provider API keys, so a key saved in the GUI outlives the container.
      - visionforge-config:/home/forge/.visionforge
    environment:
      VISIONFORGE_CONTAINER: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Same image, built for CPU. Useful on a laptop, and for checking that a
  # config runs before moving it to the GPU machine.
  visionforge-cpu:
    profiles: ["cpu"]
    build:
      context: .
      args:
        CUDA_TAG: cpu
        # Plain Ubuntu, not the CUDA runtime: a CPU wheel never loads those
        # driver libraries, and they are ~2.5 GB of image.
        BASE_IMAGE: ubuntu:22.04
        VARIANT: cpu
    image: visionforge:cpu
    ports:
      - "8000:8000"
    volumes:
      - ./datasets:/work/datasets:ro
      - ./outputs:/work/outputs
      - ./user_models:/work/user_models
      - ./user_tasks:/work/user_tasks
      - visionforge-config:/home/forge/.visionforge
    environment:
      VISIONFORGE_CONTAINER: "1"

volumes:
  visionforge-config:
