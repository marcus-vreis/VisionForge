<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Paints the chosen theme before the bundle loads (ADR-125); lib/theme.ts takes over. -->
    <script>
      try {
        var vfTheme = localStorage.getItem("vf.theme");
        if (vfTheme !== "light" && vfTheme !== "dark") {
          vfTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = vfTheme;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <title>VisionForge — Local AI Training</title>
    <script type="module" crossorigin src="/assets/index-DB_nmkrZ.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DomHNOpR.css">
  </head>

  </body>
</html>
