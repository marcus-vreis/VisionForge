name: CD — Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]

jobs:
  build:
    name: Build Python package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel and sdist
        run: |
          uv build

      # The tag and the packaged version are set in two different places, so
      # they can disagree: tagging v0.2.0 without bumping publishes 0.1.0 under
      # a v0.2.0 release, or fails deep inside the upload when PyPI rejects a
      # version that already exists. Failing here says which two values
      # disagree, before anything is published.
      - name: Tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BUILT=$(ls dist/*.whl | head -1 | sed -E 's/.*-([0-9]+\.[0-9]+\.[0-9]+)-py3.*/\1/')
          echo "tag=$TAG  built=$BUILT"
          if [ "$TAG" != "$BUILT" ]; then
            echo "::error::Tag v$TAG does not match the packaged version $BUILT."
            echo "::error::Release with 'bump-my-version bump <part>', which"
            echo "::error::updates pyproject.toml + CITATION.cff + CHANGELOG,"
            echo "::error::commits and tags in one step."
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          retention-days: 90

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    # Runs on version tags only. Uses PyPI Trusted Publishing (OIDC) — no API
    # token stored in the repo. One-time setup on pypi.org: project → Manage →
    # Publishing → add GitHub publisher (owner: marcus-vreis, repo: VisionForge,
    # workflow: cd.yml, environment: pypi).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
