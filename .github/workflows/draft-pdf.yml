name: Draft PDF
on:
  push:
    paths:
      - paper/**
      - .github/workflows/draft-pdf.yml

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Block placeholders on submission branches
        if: startsWith(github.ref_name, 'submission/')
        run: python3 paper/check_submission.py --strict
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: paper
          path: paper/paper.pdf
