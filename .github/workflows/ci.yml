name: Code quality

on:
  push:
    # "development", not "develop": this repository has no branch by that name,
    # so for months these checks ran only when main was promoted — after the
    # point where finding a problem is cheap.
    branches: ["main", "development"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.13-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Run hooks
        env:
          SKIP: pytest
        run: python -m pre_commit run --all-files --show-diff-on-failure

  pre-commit-check-hooks-versions:
    name: pre-commit-check-hooks-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: pip install pre-commit --quiet
      - name: Detect outdated hook versions
        run: |
          pre-commit autoupdate
          if ! git diff --quiet .pre-commit-config.yaml; then
            echo "::warning::Some hooks have newer versions. Run: pre-commit autoupdate"
            git checkout .pre-commit-config.yaml
          fi

  main:
    name: main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v10.3.1

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Spell check (codespell)
        run: |
          source .venv/bin/activate
          codespell src/ tests/ *.md *.toml

      - name: Lint (ruff)
        run: |
          source .venv/bin/activate
          ruff check src/ tests/

      - name: Format check (ruff format)
        run: |
          source .venv/bin/activate
          ruff format --check src/ tests/

      - name: Type check (mypy)
        run: |
          source .venv/bin/activate
          mypy src/

      - name: Check version bump on PR
        if: github.event_name == 'pull_request'
        run: |
          source .venv/bin/activate
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:pyproject.toml \
            | grep '^version' | head -1 | sed 's/version = "//;s/"//')
          PR_VERSION=$(grep '^version' pyproject.toml | head -1 \
            | sed 's/version = "//;s/"//')
          echo "Base: $BASE_VERSION  →  PR: $PR_VERSION"
          if [ "$BASE_VERSION" = "$PR_VERSION" ]; then
            echo "::warning::Version not bumped. Run: bump-my-version bump patch"
          fi

  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: main
    # A Windows-only hang (a stuck DataLoader worker) would otherwise hold the
    # runner for GitHub's 6-hour default.
    timeout-minutes: 30
    strategy:
      # One red leg must not hide the others: a Windows-only failure and a
      # 3.12-only failure are different bugs, and both should be visible.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        # Git Bash on the Windows runner, so the steps below are one script.
        shell: bash

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.3.1

      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          # bin/ on Linux, Scripts/ on Windows.
          if [ "$RUNNER_OS" = "Windows" ]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          uv pip install -e ".[dev]"
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          pytest \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=70

      # Coverage is reported once: every leg measures the same code, and
      # SonarCloud takes a single report.
      - name: Upload coverage XML (for SonarCloud)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 1

      - name: Upload HTML coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 1

  detection:
    name: detection (ultralytics)
    runs-on: ubuntu-latest
    needs: main

    # The default detection backend, actually trained. Every other detection
    # test hands the trainer a fake YOLO class, which proved our argument
    # translation and nothing about the library's behaviour — a phantom epoch
    # sat in every YOLO run for months because of it (ADR-097). Its own job
    # because installing the extra costs more than the rest of the suite.
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v10.3.1

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev,detection]"
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Train one epoch for real
        run: |
          source .venv/bin/activate
          pytest tests/e2e/test_ultralytics_training.py -m slow --no-cov -p no:randomly

  selftest:
    name: selftest (every task, trained)
    runs-on: ubuntu-latest
    needs: main

    # The harness from ADR-060, which until now only ran when somebody typed
    # `visionforge selftest`. It drives a live server through every task and
    # every strategy with real (tiny) trainings — 27 cases, ~3 minutes locally.
    # It is the only check that exercises the API, the SSE stream, the trainers
    # and run.json together, which is where the last few defects lived.
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v10.3.1

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev,detection]"
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run every task through a live server
        run: |
          source .venv/bin/activate
          visionforge selftest --json selftest.json

      - name: Upload the outcomes
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: selftest-outcomes
          path: selftest.json
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit tests (vitest)
        working-directory: frontend
        run: npx vitest run

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      # `tsc -b`, not `tsc --noEmit`: the root tsconfig is a solution file with
      # `"files": []`, so a plain --noEmit run type-checks nothing and always
      # passes. Building the SPA is what actually type-checks it.
      - name: Build SPA (type-checks via tsc -b)
        working-directory: frontend
        run: npm run build

  e2e:
    name: e2e (GUI in a browser, Playwright)
    runs-on: ubuntu-latest
    needs: main
    timeout-minutes: 20

    # The built SPA driven in a real browser against a real `visionforge gui`,
    # training the sample classification dataset on the CPU (issue #52). The unit
    # tests mock the API and the selftest has no browser; this is the only check
    # that the buttons a researcher presses reach the trainer and come back.
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v10.3.1

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # The suite tests the bundle the server serves, so it is built from this commit.
      - name: Build SPA
        working-directory: frontend
        run: npm run build

      - name: Install Playwright's chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the e2e suite
        working-directory: frontend
        env:
          VF_E2E_EXECUTABLE: ${{ github.workspace }}/.venv/bin/visionforge
        run: npm run e2e

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  distribution:
    name: distribution (installed wheel, CPU)
    runs-on: ubuntu-latest
    needs: main
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/visionforge-wheel"
          "$RUNNER_TEMP/visionforge-wheel/bin/python" -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/visionforge-wheel/bin/python" -m pip install dist/*.whl
      - name: Exercise the installed package outside the checkout
        run: |
          cp scripts/verify_distribution.py "$RUNNER_TEMP/verify_distribution.py"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/visionforge-wheel/bin/python" verify_distribution.py --checkout "$GITHUB_WORKSPACE" --workspace "$RUNNER_TEMP/wheel-smoke"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Download HTML coverage report
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-html
          path: htmlcov/

      - name: Publish coverage report as artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

  sonarqube:
    name: sonarqube
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/development')

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Read analyzed project version
        id: sonar-version
        run: python scripts/sonar_project_version.py >> "$GITHUB_OUTPUT"

      - name: Download coverage XML
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-xml

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.sonar-version.outputs.version }}
            -Dsonar.python.coverage.reportPaths=coverage.xml
